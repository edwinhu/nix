# keyd: right Cmd -> F13, the herdr leader (~/.config/herdr/config.toml prefix).
#
# This host has no F13 in hardware — the built-in Apple keyboard stops at F12
# and the Glove80 thumb key that owns the leader elsewhere isn't here. keyd
# remaps at evdev, below the compositor, so the key reaches TUIs (ghostty emits
# kitty-protocol `CSI 57376 u`), TTYs, and any attached keyboard alike.
#
# Right Cmd is KEY_RIGHTMETA: hid_apple has swap_opt_cmd=0, so Cmd is Meta and
# Opt is Alt. Hyprland's SUPER binds keep working off left Cmd.
#
# Install (root-owned, outside home-manager's reach):
#   sudo pacman -S --needed keyd
#   sudo install -Dm644 ~/nix/hosts/linux/alarm/files/keyd-default.conf \
#     /etc/keyd/default.conf
#   sudo systemctl enable --now keyd
# Reload after edits: sudo keyd reload
# Panic exit if a remap ever locks the keyboard: hold backspace+esc+enter.

[ids]
*

[main]
rightmeta = f13

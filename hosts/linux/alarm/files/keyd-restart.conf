# Drop-in for keyd.service. The Arch unit ships no Restart=, so a single crash
# leaves the machine with no remap and no sign of it until you reach for the key.
#
# Install:
#   sudo install -Dm644 ~/nix/hosts/linux/alarm/files/keyd-restart.conf \
#     /etc/systemd/system/keyd.service.d/restart.conf
#   sudo systemctl daemon-reload && sudo systemctl restart keyd
#
# The burst limit is deliberate: keyd asserts (not exits) when the machine has
# more than 64 input devices, so an unbounded restart loop would just spin on a
# core dump. Five tries then stop, leaving the failure visible in the journal.

[Service]
Restart=on-failure
RestartSec=5

[Unit]
StartLimitBurst=5
StartLimitIntervalSec=120

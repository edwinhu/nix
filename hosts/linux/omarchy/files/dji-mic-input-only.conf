## DJI Mic 3 TX exposes no A2DP, so its only profiles are HSP/HFP, and HFP's
## SCO link is bidirectional by spec: BlueZ always creates a sink beside the
## source. bluez.lua ignores node.disabled, so the sink cannot be removed.
## Drive its priority to 0 instead, so the default-node policy never picks it
## and no stream ever falls back to it.

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.8C_58_23_B1_01_17.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 0
        priority.driver  = 0
      }
    }
  }
]

## The global a2dp autoconnect rule lists only [a2dp_sink a2dp_source], and this
## device has neither role, so it was never auto-connected. Scope the headset
## roles to this MAC so dual-profile headsets keep preferring A2DP.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "bluez_card.8C_58_23_B1_01_17"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hsp_hs ]
      }
    }
  }
]

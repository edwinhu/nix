# Hyper (F13) leader binds.
#
# History: this file used to be a large cmux→limux keymap translation — every
# bind mirrored a cmux macOS Cmd shortcut, remapped to limux's ugly stock
# Ctrl+Alt(+Shift) accelerator (limux's keybind editor couldn't bind F13
# itself). Both are gone: the terminal workspace manager is now herdr, a TUI
# that reads its keys straight from the terminal and binds them natively in
# ~/.config/herdr/config.toml (tmux-style ctrl+b prefix). There is nothing left
# for xremap to translate, so only the one non-limux bind survives.
#
# Global (no app filter): F13-v runs the vimium-toggle binary.
virtual_modifiers:
  - F13
keymap:
  - name: hyper
    remap:
      # Hyper+V: toggle "vim mode" (Vimium) globally on/off, default OFF. Runs
      # the nix vimium-toggle binary directly (absolute store path injected by
      # the omarchy host's xdg.configFile). See default.nix.
      F13-v: { launch: ["@VIMIUM_TOGGLE@"] }

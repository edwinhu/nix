## Force audio through HDMI/DisplayPort (GPU) and fully disable the onboard
## analog output.
##
## The ALC623 onboard codec exposes its only analog output as a "Headphones"
## port (analog-output-headphones, priority 9900, jack availability unknown),
## so WirePlumber treats it as always-present and keeps routing there even with
## nothing plugged in. Nobody uses wired headphones on this box; audio goes out
## the monitor over DisplayPort. Disable the analog output sink outright so it
## never becomes a routing target, and bump the HDMI sink's session priority.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_c3_00.6.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_c3_00.1.hdmi-stereo" }
    ]
    actions = {
      update-props = {
        priority.session = 2000

        ## Never let this sink be suspended on idle.
        ##
        ## The chain is PC --DP--> BenQ EX321UX --HDMI eARC--> soundbar, and the
        ## eARC handshake is between the monitor and the soundbar; the PC does
        ## not participate and cannot see it (the ELD only ever describes the
        ## BenQ). When WirePlumber suspends this sink a few seconds after audio
        ## stops, the DP audio stream stops and the monitor's eARC transmitter
        ## loses its source; the link can then fail to come back when audio
        ## resumes, and the only recovery is replugging the soundbar - the local
        ## graph looks perfectly healthy throughout. Same reasoning as the
        ## session.suspend-timeout-seconds = 0 on the `kef` null sink.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
